<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@stackline/vue-multiselect-dropdown docs</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #ecfdf5 0%, #f4f8ff 44%, #edf4ff 100%);
        color: #102033;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .card {
        width: min(720px, calc(100vw - 32px));
        border: 1px solid #dbe4f0;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 24px 60px rgba(24, 42, 68, 0.1);
        padding: 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 2.6rem;
      }

      p {
        color: #61758d;
        line-height: 1.6;
      }

      a {
        display: block;
        border: 1px solid #dbe4f0;
        border-radius: 16px;
        background: white;
        color: inherit;
        text-decoration: none;
        padding: 14px 16px;
      }

      strong {
        display: block;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>@stackline/vue-multiselect-dropdown</h1>
      <p>Choose the maintained docs line that matches your Vue application.</p>
      <a href="./vue-2/">
        <strong>Vue 2 docs</strong>
        First maintained line · package 2.x
      </a>
      <a href="./vue-3/" style="margin-top: 12px;">
        <strong>Vue 3 docs</strong>
        Current maintained line · package 3.x
      </a>
    </div>
  </body>
</html>
